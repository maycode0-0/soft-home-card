# Soft Home · 柔光
# Copy to /config/themes/soft_home.yaml, then reload themes.
# One theme, two modes. No card-mod or external font required.
Soft Home:
  # Typography and shape
  primary-font-family: '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif'
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-heading: "var(--primary-font-family)"
  ha-font-family-longform: "var(--primary-font-family)"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  ha-card-border-radius: "28px"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--soft-home-edge)"
  ha-card-background: "var(--card-background-color)"
  ha-card-box-shadow: "var(--soft-home-shadow)"
  ha-card-header-font-size: "18px"
  ha-card-header-font-weight: "600"
  ha-card-header-color: "var(--primary-text-color)"
  ha-border-radius-sm: "8px"
  ha-border-radius-md: "12px"
  ha-border-radius-lg: "20px"
  ha-border-radius-xl: "28px"
  ha-dialog-border-radius: "28px"
  mdc-shape-small: "12px"
  mdc-shape-medium: "16px"
  mdc-shape-large: "28px"

  # Shared surfaces and text
  primary-color: "var(--soft-home-blue)"
  accent-color: "var(--soft-home-blue)"
  primary-background-color: "var(--soft-home-page)"
  secondary-background-color: "var(--soft-home-recess)"
  lovelace-background: "var(--soft-home-page)"
  card-background-color: "var(--soft-home-card)"
  clear-background-color: "var(--soft-home-card)"
  primary-text-color: "var(--soft-home-text)"
  secondary-text-color: "var(--soft-home-muted)"
  disabled-text-color: "var(--soft-home-disabled)"
  divider-color: "var(--soft-home-line)"
  outline-color: "var(--soft-home-line)"
  outline-hover-color: "var(--soft-home-blue)"
  scrollbar-thumb-color: "var(--soft-home-line)"

  # Header and sidebar
  app-header-background-color: "var(--soft-home-card)"
  app-header-text-color: "var(--soft-home-text)"
  app-header-border-bottom: "1px solid var(--soft-home-line)"
  app-header-edit-background-color: "var(--soft-home-recess)"
  app-header-edit-text-color: "var(--soft-home-text)"
  sidebar-background-color: "var(--soft-home-card)"
  sidebar-text-color: "var(--soft-home-text)"
  sidebar-icon-color: "var(--soft-home-muted)"
  sidebar-selected-text-color: "var(--soft-home-blue)"
  sidebar-selected-icon-color: "var(--soft-home-blue)"
  sidebar-selected-background-color: "var(--soft-home-recess)"

  # Controls, inputs and dialogs
  state-icon-color: "var(--soft-home-muted)"
  state-active-color: "var(--soft-home-blue)"
  state-inactive-color: "var(--soft-home-muted)"
  state-unavailable-color: "var(--soft-home-disabled)"
  switch-checked-color: "var(--soft-home-blue)"
  switch-checked-button-color: "var(--soft-home-blue)"
  switch-checked-track-color: "var(--soft-home-blue)"
  switch-unchecked-button-color: "var(--soft-home-card)"
  switch-unchecked-track-color: "var(--soft-home-line)"
  slider-color: "var(--soft-home-blue)"
  slider-secondary-color: "var(--soft-home-recess)"
  slider-track-color: "var(--soft-home-line)"
  input-fill-color: "var(--soft-home-recess)"
  input-disabled-fill-color: "var(--soft-home-page)"
  input-ink-color: "var(--soft-home-text)"
  input-label-ink-color: "var(--soft-home-muted)"
  input-disabled-ink-color: "var(--soft-home-disabled)"
  input-dropdown-icon-color: "var(--soft-home-muted)"
  input-idle-line-color: "var(--soft-home-line)"
  input-hover-line-color: "var(--soft-home-blue)"
  input-outlined-idle-border-color: "var(--soft-home-line)"
  input-outlined-hover-border-color: "var(--soft-home-blue)"
  mdc-theme-surface: "var(--soft-home-card)"
  mdc-theme-on-surface: "var(--soft-home-text)"
  mdc-dialog-scrim-color: "rgba(8, 16, 30, 0.42)"
  ha-dialog-surface-background: "var(--soft-home-card)"
  ha-dialog-scrim-backdrop-filter: "blur(4px)"
  ha-assist-chip-filled-container-color: "var(--soft-home-recess)"
  ha-assist-chip-active-container-color: "var(--soft-home-blue-soft)"
  chip-background-color: "var(--soft-home-recess)"
  label-badge-background-color: "var(--soft-home-card)"
  label-badge-text-color: "var(--soft-home-text)"
  table-header-background-color: "var(--soft-home-recess)"
  table-row-background-color: "var(--soft-home-card)"
  table-row-alternative-background-color: "var(--soft-home-page)"
  data-table-background-color: "var(--soft-home-card)"
  markdown-code-background-color: "var(--soft-home-recess)"

  # Current HA semantic tokens, alongside the classic variables above.
  ha-color-focus: "var(--soft-home-blue)"
  ha-color-text-primary: "var(--soft-home-text)"
  ha-color-text-secondary: "var(--soft-home-muted)"
  ha-color-text-disabled: "var(--soft-home-disabled)"
  ha-color-text-link: "var(--soft-home-blue)"
  ha-color-surface-default: "var(--soft-home-card)"
  ha-color-surface-low: "var(--soft-home-page)"
  ha-color-surface-lower: "var(--soft-home-recess)"
  ha-color-on-surface-default: "var(--soft-home-text)"
  ha-color-border-neutral-quiet: "var(--soft-home-line)"
  ha-color-border-neutral-normal: "var(--soft-home-disabled)"
  ha-color-border-neutral-loud: "var(--soft-home-muted)"
  ha-color-border-primary-quiet: "var(--soft-home-line)"
  ha-color-border-primary-normal: "var(--soft-home-blue)"
  ha-color-border-primary-loud: "var(--soft-home-blue)"
  ha-color-fill-primary-quiet-resting: "var(--soft-home-blue-soft)"
  ha-color-fill-primary-quiet-hover: "var(--soft-home-recess)"
  ha-color-fill-primary-quiet-active: "var(--soft-home-blue-soft)"
  ha-color-fill-primary-normal-resting: "var(--soft-home-blue-soft)"
  ha-color-fill-primary-normal-hover: "var(--soft-home-recess)"
  ha-color-fill-primary-normal-active: "var(--soft-home-blue-soft)"
  ha-color-fill-primary-loud-resting: "var(--soft-home-blue)"
  ha-color-fill-primary-loud-hover: "var(--soft-home-blue-hover)"
  ha-color-fill-primary-loud-active: "var(--soft-home-blue)"
  ha-color-on-primary-quiet: "var(--soft-home-blue)"
  ha-color-on-primary-normal: "var(--soft-home-blue)"
  ha-color-on-primary-loud: "var(--text-primary-color)"
  ha-color-fill-neutral-quiet-resting: "var(--soft-home-page)"
  ha-color-fill-neutral-quiet-hover: "var(--soft-home-recess)"
  ha-color-fill-neutral-quiet-active: "var(--soft-home-page)"
  ha-color-fill-neutral-normal-resting: "var(--soft-home-recess)"
  ha-color-fill-neutral-normal-hover: "var(--soft-home-line)"
  ha-color-fill-neutral-normal-active: "var(--soft-home-recess)"
  ha-color-on-neutral-quiet: "var(--soft-home-muted)"
  ha-color-on-neutral-normal: "var(--soft-home-text)"
  ha-color-form-background: "var(--soft-home-recess)"
  ha-color-form-background-hover: "var(--soft-home-page)"
  ha-color-form-background-disabled: "var(--soft-home-line)"
  ha-box-shadow-s: "var(--soft-home-shadow)"
  ha-box-shadow-m: "var(--soft-home-shadow)"

  # Meaningful state colors. Keep unlocked / jammed locks and safety alerts red.
  success-color: "var(--soft-home-green)"
  warning-color: "var(--soft-home-amber)"
  error-color: "var(--soft-home-red)"
  info-color: "var(--soft-home-blue)"
  state-light-active-color: "var(--soft-home-amber)"
  state-switch-active-color: "var(--soft-home-blue)"
  state-cover-active-color: "var(--soft-home-blue)"
  state-fan-active-color: "var(--soft-home-blue)"
  state-climate-cool-color: "var(--soft-home-blue)"
  state-climate-heat-color: "var(--soft-home-amber)"
  state-climate-auto-color: "var(--soft-home-green)"
  state-vacuum-active-color: "var(--soft-home-green)"
  state-lock-locked-color: "var(--soft-home-green)"
  state-lock-unlocked-color: "var(--soft-home-red)"
  state-lock-open-color: "var(--soft-home-red)"
  state-lock-jammed-color: "var(--soft-home-red)"
  state-person-home-color: "var(--soft-home-green)"
  state-media_player-active-color: "var(--soft-home-blue)"
  energy-grid-consumption-color: "var(--soft-home-blue)"
  energy-solar-color: "var(--soft-home-amber)"
  energy-battery-out-color: "var(--soft-home-green)"
  energy-water-color: "var(--soft-home-blue)"

  modes:
    light:
      soft-home-page: "#eaf0f8"
      soft-home-card: "#f8fbff"
      soft-home-recess: "#e6eef8"
      soft-home-text: "#243a55"
      soft-home-muted: "#596f8a"
      soft-home-disabled: "#879bb3"
      soft-home-line: "#d7e2ef"
      soft-home-edge: "#ffffff"
      soft-home-blue: "#286abc"
      soft-home-blue-hover: "#205b9f"
      soft-home-blue-soft: "#e6effa"
      soft-home-green: "#2c7966"
      soft-home-green-soft: "#e8f4ef"
      soft-home-amber: "#8f5d2b"
      soft-home-amber-soft: "#f5eadb"
      soft-home-red: "#b64035"
      soft-home-red-soft: "#fbece9"
      soft-home-shadow: "6px 7px 22px rgba(128, 152, 182, 0.11), -5px -5px 16px rgba(255, 255, 255, 0.61)"
      text-primary-color: "#ffffff"
      rgb-primary-color: "40, 106, 188"
      rgb-accent-color: "40, 106, 188"
      rgb-primary-text-color: "36, 58, 85"
      rgb-secondary-text-color: "89, 111, 138"
      rgb-text-primary-color: "255, 255, 255"
      rgb-card-background-color: "248, 251, 255"
      rgb-success-color: "44, 121, 102"
      rgb-warning-color: "143, 93, 43"
      rgb-error-color: "182, 64, 53"
      rgb-info-color: "40, 106, 188"
    dark:
      soft-home-page: "#172334"
      soft-home-card: "#243449"
      soft-home-recess: "#202d40"
      soft-home-text: "#ecf3fc"
      soft-home-muted: "#b5c5da"
      soft-home-disabled: "#7f95b0"
      soft-home-line: "#3b506a"
      soft-home-edge: "#40536c"
      soft-home-blue: "#93c5fd"
      soft-home-blue-hover: "#b3d7ff"
      soft-home-blue-soft: "#2b4260"
      soft-home-green: "#8cdbbb"
      soft-home-green-soft: "#25483e"
      soft-home-amber: "#edba7e"
      soft-home-amber-soft: "#483a29"
      soft-home-red: "#ffb4a9"
      soft-home-red-soft: "#503532"
      soft-home-shadow: "6px 7px 22px rgba(8, 16, 30, 0.19), -5px -5px 16px rgba(83, 99, 122, 0.05)"
      text-primary-color: "#172334"
      rgb-primary-color: "147, 197, 253"
      rgb-accent-color: "147, 197, 253"
      rgb-primary-text-color: "236, 243, 252"
      rgb-secondary-text-color: "181, 197, 218"
      rgb-text-primary-color: "23, 35, 52"
      rgb-card-background-color: "36, 52, 73"
      rgb-success-color: "140, 219, 187"
      rgb-warning-color: "237, 186, 126"
      rgb-error-color: "255, 180, 169"
      rgb-info-color: "147, 197, 253"
