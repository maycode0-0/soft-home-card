<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Home Card · Home Assistant 交互预览</title>
<style>body{margin:0;background:#e9eff8;color:#23334c;font:15px 'Microsoft YaHei',system-ui,sans-serif}header{padding:36px 30px 22px;max-width:1660px;margin:auto}small{letter-spacing:2px;color:#3f86df;font-size:11px}h1{font-size:28px;margin:12px 0}p{color:#71839d;line-height:1.7}nav{display:flex;gap:10px;flex-wrap:wrap}nav button{padding:10px 15px;border:1px solid #d1ddeb;border-radius:10px;background:#f7faff;cursor:pointer;color:#23334c}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;padding:0 30px 30px;max-width:1660px;margin:auto;align-items:start}#log{position:fixed;right:18px;bottom:18px;max-width:min(420px,85vw);max-height:180px;overflow:auto;background:#23334ceF;color:#fff;padding:12px;border-radius:12px;font-size:11px;white-space:pre-wrap;z-index:20;display:none}#editor-dialog{width:min(640px,85vw);border:1px solid #dce5f0;border-radius:20px;padding:24px;background:#f7faff}#editor-dialog::backdrop{background:#10243a66}#editor-close{float:right;border:0;background:transparent;cursor:pointer;font-size:24px}@media(max-width:400px){main{grid-template-columns:1fr;padding:0 12px 20px}header{padding:24px 18px}}body.dark{background:#172133;color:#e8f0fc}body.dark header p{color:#afbed3}</style>
</head><body><header><small>SOFT HOME / HOME ASSISTANT</small><h1>柔光设备卡片 · 可交互预览</h1><p>23 种设备外观。此页使用模拟实体，操作只更新演示数据，不连接真实设备。<a href="/demo/redesign.html">查看设备专属布局 →</a></p><nav><button id="theme">切换深色</button><button id="offline">模拟离线</button><button id="failure">下一次操作模拟失败</button><button id="edit">打开可视化编辑器</button></nav></header><main id="cards"></main><div id="log" role="status"></div><dialog id="editor-dialog"><button id="editor-close" aria-label="关闭">×</button><h2>可视化配置</h2><soft-home-card-editor></soft-home-card-editor></dialog>
<script src="../dist/soft-home-card.js"></script>
<script type="module">
import {createMock,DEMO_CONFIGS,state} from '/demo/mock.js';
import '/demo/icons.js';
window.mock=createMock();window.cards=DEMO_CONFIGS.map(c=>{const el=document.createElement('soft-home-card');el.setConfig({type:'custom:soft-home-card',...c,theme:'auto'});el.hass=window.mock;document.querySelector('#cards').append(el);return el;});
mock.notify=()=>{for(const el of cards)el.hass={...mock};const log=document.querySelector('#log');if(mock.calls.length){log.style.display='block';log.textContent=JSON.stringify(mock.calls.at(-1),null,2);}};
document.querySelector('#theme').onclick=()=>{mock.themes={darkMode:!mock.themes.darkMode};document.body.classList.toggle('dark',mock.themes.darkMode);mock.notify();};
let offline=false;const saved={...mock.states};document.querySelector('#offline').onclick=()=>{offline=!offline;mock.states=offline?Object.fromEntries(Object.entries(mock.states).map(([id,s])=>[id,state(id,'unavailable',s.attributes)])):{...saved};mock.notify();};
document.querySelector('#failure').onclick=()=>{mock.rejectNext=true;document.querySelector('#failure').textContent='已设置：下次操作将失败';};
const editor=document.querySelector('soft-home-card-editor');editor.hass=mock;editor.setConfig({...DEMO_CONFIGS[10],type:'custom:soft-home-card',show_stats:true,theme:'auto'});editor.addEventListener('config-changed',e=>{window.lastEditorConfig=e.detail.config;editor.setConfig(e.detail.config);try{cards[10].setConfig(e.detail.config);}catch{}});
document.querySelector('#edit').onclick=()=>document.querySelector('#editor-dialog').showModal();document.querySelector('#editor-close').onclick=()=>document.querySelector('#editor-dialog').close();
document.addEventListener('hass-more-info',e=>{window.lastMoreInfo=e.detail.entityId;const log=document.querySelector('#log');log.style.display='block';log.textContent='实体详情：'+e.detail.entityId;});
</script></body></html>
