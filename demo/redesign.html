<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Home · 设备专属布局</title>
<style>
:root{color-scheme:light;--page:#e9eff8;--ink:#23334c;--muted:#60748e;--panel:#f7faff;--line:#d3dfed;--blue:#286fc4}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:'Microsoft YaHei',system-ui,sans-serif;transition:background .2s}body.dark{color-scheme:dark;--page:#172133;--ink:#e8f0fc;--muted:#afbed3;--panel:#273449;--line:#40516a;--blue:#9ac8ff}header,main,footer{max-width:1240px;margin:auto}header{padding:48px 32px 30px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:10px;letter-spacing:2.5px;font-weight:600}.brand-mark{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);box-shadow:3px 4px 7px #8098b62c,-3px -3px 7px #ffffff70;border-radius:7px;letter-spacing:0}.title-row{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:16px 0 0}h1{font-size:30px;line-height:1.4;letter-spacing:1px;font-weight:650;margin:0}header p{color:var(--muted);font-size:12px;line-height:1.8;margin:10px 0 0}nav{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}button,a{font:inherit;color:inherit}nav button,nav a{border:1px solid var(--line);border-radius:11px;min-height:38px;padding:8px 13px;background:var(--panel);color:var(--muted);font-size:11px;text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:6px}nav button:hover,nav a:hover{border-color:var(--blue);color:var(--blue)}nav button[aria-pressed=true]{background:var(--blue);color:var(--page);border-color:var(--blue)}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}.demo-note{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-top:22px}.demo-note:before{content:'';width:5px;height:5px;background:#398974;border-radius:50%}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:26px;padding:0 32px}.gallery-column{display:grid;gap:27px;min-width:0}.gallery-item{min-width:0}.gallery-label{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);margin:0 2px 10px}.gallery-label span{font-size:9px;color:var(--blue);font-variant-numeric:tabular-nums}.gallery-label:after{content:'';flex:1;height:1px;background:var(--line);margin-left:3px}footer{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:30px 34px 38px;color:var(--muted);font-size:10px;line-height:1.7}footer a{color:var(--blue);text-decoration:none}#notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);font-size:12px;padding:12px 20px;border-radius:12px;box-shadow:0 6px 24px #15243a20;z-index:10;max-width:90vw;display:none}
@media(min-width:1700px){header,main,footer{max-width:1380px}}@media(max-width:1000px){.title-row{align-items:flex-start;flex-direction:column;gap:18px}main{gap:18px;padding:0 22px}header{padding:32px 24px 26px}.gallery-column{gap:22px}}@media(max-width:800px){main{display:block;max-width:460px}.gallery-column{margin-bottom:24px;gap:24px}.title-row h1{font-size:25px}header{max-width:460px;padding:30px 22px 25px}.demo-note{font-size:10px}footer{max-width:460px;align-items:flex-start;flex-direction:column;padding:5px 24px 30px}}@media(prefers-reduced-motion:reduce){body{transition:none}}
</style></head>
<body><header><div class="eyebrow"><span class="brand-mark">S</span>SOFT HOME · 柔光设备卡片</div><div class="title-row"><div><h1>更顺手的家居控制</h1><p>常用操作一眼可见，更多设置有序展开。</p></div><nav aria-label="预览选项"><button id="theme" aria-pressed="false">◐ 深色</button><button id="offline" aria-pressed="false">模拟离线</button><button id="readonly" aria-pressed="false">只读模式</button><a href="/demo/index.html">全部 23 种设备 ↗</a></nav></div><div class="demo-note">交互演示 · 使用模拟数据，操作仅更新本页状态</div></header>
<main id="gallery"></main><footer><span>SOFT HOME / HOME ASSISTANT</span><span>摄像头画面为本地示意图 · <a href="/demo/washer.html">洗衣机专属预览 ↗</a></span></footer><div id="notice" role="status"></div>
<script src="/dist/soft-home-card.js"></script><script type="module">
import {createMock,DEMO_CONFIGS} from '/demo/mock.js';
import '/demo/icons.js';
window.mock=createMock();window.cards=[];
const groups=[
  [['air_conditioner','01','温控与舒适'],['vacuum','04','全屋清洁'],['temperature_humidity','07','室内环境']],
  [['refrigerator','02','分区保鲜'],['door_lock','05','入户安全'],['projector_lift','08','升降与行程']],
  [['spotlight','03','光线与氛围'],['curtain','06','窗边光影'],['camera','09','家中视野']],
];
for(const group of groups){const column=document.createElement('div');column.className='gallery-column';for(const [device,index,label] of group){const item=document.createElement('section');item.className='gallery-item';const caption=document.createElement('div');caption.className='gallery-label';caption.innerHTML=`<span>${index}</span>${label}`;const el=document.createElement('soft-home-card');el.setConfig({...DEMO_CONFIGS.find(c=>c.device===device),type:'custom:soft-home-card',theme:'auto'});el.hass=mock;item.append(caption,el);column.append(item);cards.push(el);}document.querySelector('#gallery').append(column);}
const notify=text=>{const el=document.querySelector('#notice');el.textContent=text;el.style.display='block';clearTimeout(window.noticeTimeout);window.noticeTimeout=setTimeout(()=>el.style.display='none',2600);};
mock.notify=()=>{for(const el of cards)el.hass={...mock};if(mock.calls.length)notify('已更新演示状态');};
document.querySelector('#theme').onclick=event=>{mock.themes={darkMode:!mock.themes.darkMode};document.body.classList.toggle('dark',mock.themes.darkMode);event.currentTarget.setAttribute('aria-pressed',mock.themes.darkMode);event.currentTarget.textContent=mock.themes.darkMode?'◐ 浅色':'◐ 深色';for(const el of cards)el.hass={...mock};};
const saved={...mock.states};let offline=false;document.querySelector('#offline').onclick=event=>{offline=!offline;event.currentTarget.setAttribute('aria-pressed',offline);mock.states=offline?Object.fromEntries(Object.entries(mock.states).map(([id,s])=>[id,{...s,state:'unavailable'}])):{...saved};for(const el of cards)el.hass={...mock};};
let readOnly=false;document.querySelector('#readonly').onclick=event=>{readOnly=!readOnly;event.currentTarget.setAttribute('aria-pressed',readOnly);for(const el of cards)el.setConfig({...el._config,read_only:readOnly});};
document.addEventListener('hass-more-info',event=>notify('已打开实体详情：'+(mock.states[event.detail.entityId]?.attributes?.friendly_name||event.detail.entityId)));
</script></body></html>
