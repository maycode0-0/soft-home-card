name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run build
      - name: Verify version and committed artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check.mjs --tag "$RELEASE_TAG"
          git diff --exit-code -- dist/soft-home-card.js
      - name: Generate notes and checksums
        run: node scripts/release-notes.mjs "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/soft-home-card.js dist/SHA256SUMS
          --verify-tag
          --title "Soft Home Card $RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
